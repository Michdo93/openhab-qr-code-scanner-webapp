<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openHAB QR Control</title>
    
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/html5-qrcode.min.js') }}"></script>

    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; overflow-x: hidden; }
        
        #reader { 
            width: 100%; 
            max-width: 500px; 
            margin: auto; 
            border: none !important; 
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1050;
            overflow: hidden;
        }

        /* Iframe Positionierung */
        #oh-frame { 
            width: 100%; 
            height: calc(100% + 50px); /* Höhe ausgleichen wegen margin-top */
            margin-top: -55px;         /* Versteckt den Header von openHAB */
            border: none; 
        }

        .close-bar { 
            height: 60px; 
            background: #212529; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            color: white;
            position: relative;
            z-index: 1060;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container py-4 text-center">
    <div class="card shadow-sm p-3 mb-4">
        <h2 class="h4 mb-3">Gerät scannen</h2>
        <div id="reader"></div>
        <p class="text-muted small mt-3">Kamera auf QR-Code richten.</p>
    </div>
</div>

<div id="overlay">
    <div class="close-bar">
        <span class="fw-bold text-truncate" id="device-title">Gerätesteuerung</span>
        <button class="btn btn-danger btn-sm ms-auto" onclick="closeControl()">
            &times; Schließen
        </button>
    </div>
    <iframe id="oh-frame" src=""></iframe>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

<script>
    /* WICHTIG: | safe verhindert das Erzeugen von &amp; */
    const initialTargetUrl = "{{ target_url | safe }}";
    const deviceKey = "{{ device_key if device_key else '' }}";

    let html5QrcodeScanner;

    function startScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15, 
            qrbox: {width: 250, height: 250},
            aspectRatio: 1.0 
        });
        html5QrcodeScanner.render(onScanSuccess);
    }

    window.onload = function() {
        if (deviceKey && deviceKey !== "" && initialTargetUrl) {
            openOverlay(initialTargetUrl);
        } else {
            startScanner();
        }
    };

    function onScanSuccess(decodedText) {
        let key = decodedText;
        // Falls eine volle URL gescannt wird, extrahiere den Parameter
        if (decodedText.includes('device=')) {
            const urlObj = new URL(decodedText);
            key = urlObj.searchParams.get("device");
        }
        window.location.href = "/?device=" + key;
    }

    function openOverlay(url) {
        document.getElementById('device-title').innerText = "Steuerung: " + deviceKey;
        document.getElementById('oh-frame').src = url;
        document.getElementById('overlay').style.display = 'block';
    }

    function closeControl() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('oh-frame').src = "";
        window.location.href = "/"; 
    }
</script>
</body>
</html>
